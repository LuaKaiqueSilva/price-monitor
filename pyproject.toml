[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "price-monitor"
version = "1.0.0"
description = "Open-source application for monitoring product prices across multiple online stores."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

authors = [
    { name = "Luã Kaique da Silva" }
]

dependencies = [
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<7",
    "pandas>=2.2,<4",
    "plotly>=5.20,<7",
    "requests>=2.31,<3",
    "streamlit>=1.35,<2",
    "streamlit-autorefresh>=1.0,<2",
    "urllib3>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "black>=24,<27",
    "ruff>=0.5,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
